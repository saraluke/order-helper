<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara Luke Creative — Etsy Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink-light: #F3C4D6; --navy: #394350; --pink-dark: #D56D85;
    --green: #58634F; --tangerine: #E49855; --bg: #faf8f6;
    --card: #ffffff; --border: #e8e0d8; --text: #2a2420; --muted: #8a7f78;
    --status-proof: #7b9cc4;
    --status-approved: #9b7fc4;
    --status-production: #c4a44a;
    --status-complete: #58634F;
  }
  body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--navy); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--pink-dark); }
  header h1 { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--pink-light); font-weight: 400; }
  header .subtitle { font-size: 0.7rem; color: var(--pink-dark); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  #refresh-btn { background: transparent; border: 1px solid var(--pink-dark); color: var(--pink-light); padding: 6px 14px; border-radius: 3px; font-family: 'Montserrat', sans-serif; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
  #refresh-btn:hover { background: var(--pink-dark); color: white; }
  .sync-status { font-size: 0.65rem; color: var(--pink-dark); letter-spacing: 0.06em; opacity: 0.8; }
  .main { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: white; font-family: 'Montserrat', sans-serif; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; color: var(--muted); transition: all 0.2s; }
  .filter-btn.active { background: var(--navy); color: white; border-color: var(--navy); }
  .select-all-wrap { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 0.72rem; color: var(--muted); cursor: pointer; }
  .select-all-wrap input[type=checkbox] { accent-color: var(--navy); width: 15px; height: 15px; cursor: pointer; }
  .bulk-bar { background: var(--navy); color: white; padding: 12px 24px; display: flex; align-items: center; gap: 12px; font-size: 0.75rem; flex-wrap: wrap; margin-bottom: 18px; border-radius: 4px; }
  .bulk-bar.hidden { display: none; }
  .bulk-bar span { margin-right: auto; }
  .bulk-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 5px 12px; border-radius: 3px; font-family: 'Montserrat', sans-serif; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
  .bulk-btn:hover { background: rgba(255,255,255,0.25); }
  .order-grid { display: grid; gap: 14px; }
  .order-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 6px; padding: 18px 20px; display: grid; grid-template-columns: 24px 1fr auto; gap: 14px; align-items: start; transition: border-color 0.2s, box-shadow 0.2s; }
  .order-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .order-card.status-proof { border-left-color: var(--status-proof); }
  .order-card.status-approved { border-left-color: var(--status-approved); }
  .order-card.status-production { border-left-color: var(--status-production); }
  .order-card.status-complete { border-left-color: var(--status-complete); opacity: 0.7; }
  .card-check { padding-top: 3px; }
  .card-check input[type=checkbox] { accent-color: var(--navy); width: 15px; height: 15px; cursor: pointer; }
  .card-body { min-width: 0; }
  .order-meta { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .order-num { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--navy); font-weight: 600; }
  .order-name { font-size: 0.78rem; color: var(--muted); }
  .order-detail { font-size: 0.78rem; color: var(--text); margin-bottom: 4px; }
  .order-detail strong { color: var(--navy); font-weight: 600; }
  .note-display { font-size: 0.72rem; color: var(--tangerine); font-style: italic; margin-top: 6px; }
  .card-actions { display: flex; flex-direction: column; gap: 7px; align-items: flex-end; }
  .action-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .btn { padding: 5px 11px; border-radius: 3px; font-family: 'Montserrat', sans-serif; font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; border: 1px solid; transition: all 0.18s; white-space: nowrap; }
  .btn-copy { background: white; border-color: var(--border); color: var(--navy); }
  .btn-copy:hover { background: var(--navy); color: white; border-color: var(--navy); }
  .btn-copy.copied { background: var(--green); color: white; border-color: var(--green); }
  .btn-link { background: white; border-color: var(--border); color: var(--muted); text-decoration: none; display: inline-block; }
  .btn-link:hover { border-color: var(--navy); color: var(--navy); }
  .status-btns { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; }
  .sbtn { padding: 4px 9px; border-radius: 3px; font-family: 'Montserrat', sans-serif; font-size: 0.6rem; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; border: 1px solid; transition: all 0.18s; }
  .sbtn-proof { border-color: var(--status-proof); color: var(--status-proof); background: white; }
  .sbtn-proof.active, .sbtn-proof:hover { background: var(--status-proof); color: white; }
  .sbtn-approved { border-color: var(--status-approved); color: var(--status-approved); background: white; }
  .sbtn-approved.active, .sbtn-approved:hover { background: var(--status-approved); color: white; }
  .sbtn-production { border-color: var(--status-production); color: var(--status-production); background: white; }
  .sbtn-production.active, .sbtn-production:hover { background: var(--status-production); color: white; }
  .sbtn-complete { border-color: var(--status-complete); color: var(--status-complete); background: white; }
  .sbtn-complete.active, .sbtn-complete:hover { background: var(--status-complete); color: white; }
  .add-order-form { background: white; border: 1px dashed var(--border); border-radius: 6px; padding: 20px; margin-bottom: 18px; display: none; }
  .add-order-form.open { display: block; }
  .form-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .form-row input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 3px; font-family: 'Montserrat', sans-serif; font-size: 0.78rem; color: var(--text); }
  .form-actions { display: flex; gap: 8px; }
  .btn-primary { background: var(--navy); color: white; border-color: var(--navy); padding: 8px 18px; font-size: 0.72rem; }
  .btn-primary:hover { background: #2a3240; }
  .btn-cancel { background: white; color: var(--muted); border-color: var(--border); padding: 8px 18px; font-size: 0.72rem; }
  .add-btn { background: var(--pink-dark); color: white; border: none; padding: 8px 16px; border-radius: 3px; font-family: 'Montserrat', sans-serif; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
  .add-btn:hover { background: #c05c74; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.85rem; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.hidden { display: none; }
  .modal { background: white; border-radius: 6px; padding: 28px; width: 380px; max-width: 90vw; }
  .modal h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; margin-bottom: 6px; color: var(--navy); }
  .modal p { font-size: 0.78rem; color: var(--muted); margin-bottom: 16px; }
  .modal textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 3px; font-family: 'Montserrat', sans-serif; font-size: 0.8rem; min-height: 80px; resize: vertical; margin-bottom: 14px; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <div>
    <div class="subtitle">Sara Luke Creative</div>
    <h1>Etsy Orders</h1>
  </div>
  <div class="header-right">
    <span class="sync-status" id="sync-status">Loading...</span>
    <button id="refresh-btn" onclick="loadOrders()">Refresh</button>
  </div>
</header>

<div class="main">
  <div style="display:flex; gap:10px; margin-bottom:18px; align-items:center;">
    <button class="add-btn" onclick="toggleAddForm()">+ Add Order</button>
  </div>

  <div class="add-order-form" id="add-form">
    <div class="form-row">
      <input id="f-num" placeholder="Order # (e.g. 1234567890)" />
      <input id="f-name" placeholder="Customer Name" />
      <input id="f-item" placeholder="Item / Product" />
      <input id="f-personalization" placeholder="Personalization text" />
      <input id="f-url" placeholder="Order URL (optional)" />
      <input id="f-message-url" placeholder="Message thread URL (optional)" />
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="addOrder()">Add Order</button>
      <button class="btn btn-cancel" onclick="toggleAddForm()">Cancel</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" data-filter="proof" onclick="setFilter('proof',this)">Proof Sent</button>
    <button class="filter-btn" data-filter="approved" onclick="setFilter('approved',this)">Approved</button>
    <button class="filter-btn" data-filter="production" onclick="setFilter('production',this)">In Production</button>
    <button class="filter-btn" data-filter="complete" onclick="setFilter('complete',this)">Completed</button>
    <button class="filter-btn" data-filter="none" onclick="setFilter('none',this)">No Status</button>
    <div class="select-all-wrap">
      <input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)" />
      <label for="select-all">Select all visible</label>
    </div>
  </div>

  <div class="bulk-bar hidden" id="bulk-bar">
    <span id="bulk-count">0 selected</span>
    <button class="bulk-btn" onclick="bulkStatus('proof')">Proof Sent</button>
    <button class="bulk-btn" onclick="bulkStatus('approved')">Approved</button>
    <button class="bulk-btn" onclick="bulkStatus('production')">Sent to Production</button>
    <button class="bulk-btn" onclick="bulkStatus('complete')">Complete</button>
    <button class="bulk-btn" style="background:rgba(200,80,80,0.3)" onclick="clearSelected()">Clear Selection</button>
  </div>

  <div id="order-grid" class="order-grid">
    <div class="loading">Loading your orders...</div>
  </div>
</div>

<!-- Note modal -->
<div class="modal-overlay hidden" id="note-modal">
  <div class="modal">
    <h3>Add a Note</h3>
    <p>Optional — add a note for this production batch (e.g. date sent, rush, special instructions).</p>
    <textarea id="modal-note" placeholder="e.g. Sent to production May 17, rush order"></textarea>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal(false)">Skip</button>
      <button class="btn btn-primary" onclick="closeModal(true)">Save Note</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'etsy_orders_v2';
let orders = [];
let currentFilter = 'all';
let pendingModalResolve = null;

// ── Persistent storage (cross-device via Claude storage API) ──────────────────
async function saveOrders() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(orders));
    setSyncStatus('Saved');
  } catch(e) {
    setSyncStatus('Save failed');
    console.error('Storage save error:', e);
  }
}

async function loadOrders() {
  setSyncStatus('Syncing...');
  try {
    const result = await window.storage.get(STORAGE_KEY);
    orders = result ? JSON.parse(result.value) : [];
  } catch(e) {
    orders = [];
  }
  setSyncStatus('Synced');
  renderOrders();
}

function setSyncStatus(msg) {
  const el = document.getElementById('sync-status');
  if (el) el.textContent = msg;
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function renderOrders() {
  const grid = document.getElementById('order-grid');
  let visible = orders;
  if (currentFilter !== 'all') {
    visible = orders.filter(o =>
      currentFilter === 'none' ? !o.status : o.status === currentFilter
    );
  }
  if (!visible.length) {
    grid.innerHTML = '<div class="empty">No orders here yet.</div>';
    return;
  }
  grid.innerHTML = visible.map(o => cardHTML(o)).join('');
}

function cardHTML(o) {
  const statusClass = o.status ? 'status-' + o.status : '';
  return `
  <div class="order-card ${statusClass}" id="card-${o.id}">
    <div class="card-check">
      <input type="checkbox" class="order-check" data-id="${o.id}" onchange="updateBulkBar()" />
    </div>
    <div class="card-body">
      <div class="order-meta">
        <span class="order-num">${o.num}</span>
        <span class="order-name">${o.name || ''}</span>
      </div>
      ${o.item ? `<div class="order-detail"><strong>Item:</strong> ${o.item}</div>` : ''}
      ${o.personalization ? `<div class="order-detail"><strong>Personalization:</strong> ${o.personalization}</div>` : ''}
      ${o.note ? `<div class="note-display">Note: ${o.note}</div>` : ''}
    </div>
    <div class="card-actions">
      <div class="action-row">
        ${o.personalization ? `<button class="btn btn-copy" onclick="copyText('${escapeAttr(o.personalization)}', this)">Copy Personalization</button>` : ''}
        ${o.url ? `<a class="btn btn-link" href="${o.url}" target="_blank">View Order</a>` : ''}
        ${o.messageUrl ? `<a class="btn btn-link" href="${o.messageUrl}" target="_blank">Message Customer</a>` : ''}
      </div>
      <div class="status-btns">
        <button class="sbtn sbtn-proof ${o.status==='proof'?'active':''}" onclick="setStatus('${o.id}','proof')">Proof Sent</button>
        <button class="sbtn sbtn-approved ${o.status==='approved'?'active':''}" onclick="setStatus('${o.id}','approved')">Approved</button>
        <button class="sbtn sbtn-production ${o.status==='production'?'active':''}" onclick="setStatus('${o.id}','production')">Production</button>
        <button class="sbtn sbtn-complete ${o.status==='complete'?'active':''}" onclick="setStatus('${o.id}','complete')">Complete</button>
      </div>
    </div>
  </div>`;
}

function escapeAttr(s) {
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// ── Status ────────────────────────────────────────────────────────────────────
async function setStatus(id, status) {
  if (status === 'production') {
    const note = await promptNote();
    const o = orders.find(x => x.id === id);
    if (o) { o.status = status; if (note) o.note = note; }
  } else {
    const o = orders.find(x => x.id === id);
    if (o) o.status = status;
  }
  await saveOrders();
  renderOrders();
}

async function bulkStatus(status) {
  const checked = [...document.querySelectorAll('.order-check:checked')].map(c => c.dataset.id);
  if (!checked.length) return;
  let note = '';
  if (status === 'production') note = await promptNote();
  checked.forEach(id => {
    const o = orders.find(x => x.id === id);
    if (o) { o.status = status; if (note) o.note = note; }
  });
  await saveOrders();
  renderOrders();
  updateBulkBar();
}

// ── Note modal ────────────────────────────────────────────────────────────────
function promptNote() {
  return new Promise(resolve => {
    pendingModalResolve = resolve;
    document.getElementById('modal-note').value = '';
    document.getElementById('note-modal').classList.remove('hidden');
  });
}

function closeModal(save) {
  const note = save ? document.getElementById('modal-note').value.trim() : '';
  document.getElementById('note-modal').classList.add('hidden');
  if (pendingModalResolve) { pendingModalResolve(note); pendingModalResolve = null; }
}

// ── Add order ─────────────────────────────────────────────────────────────────
function toggleAddForm() {
  document.getElementById('add-form').classList.toggle('open');
}

async function addOrder() {
  const num = document.getElementById('f-num').value.trim();
  if (!num) { alert('Order number is required.'); return; }
  const order = {
    id: 'o' + Date.now(),
    num,
    name: document.getElementById('f-name').value.trim(),
    item: document.getElementById('f-item').value.trim(),
    personalization: document.getElementById('f-personalization').value.trim(),
    url: document.getElementById('f-url').value.trim(),
    messageUrl: document.getElementById('f-message-url').value.trim(),
    status: '',
    note: ''
  };
  orders.unshift(order);
  await saveOrders();
  renderOrders();
  ['f-num','f-name','f-item','f-personalization','f-url','f-message-url'].forEach(id => document.getElementById(id).value = '');
  toggleAddForm();
}

// ── Filter ────────────────────────────────────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

// ── Select / bulk ─────────────────────────────────────────────────────────────
function toggleSelectAll(checked) {
  document.querySelectorAll('.order-check').forEach(c => c.checked = checked);
  updateBulkBar();
}

function updateBulkBar() {
  const count = document.querySelectorAll('.order-check:checked').length;
  const bar = document.getElementById('bulk-bar');
  document.getElementById('bulk-count').textContent = count + ' selected';
  bar.classList.toggle('hidden', count === 0);
}

function clearSelected() {
  document.querySelectorAll('.order-check').forEach(c => c.checked = false);
  document.getElementById('select-all').checked = false;
  updateBulkBar();
}

// ── Copy ──────────────────────────────────────────────────────────────────────
function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = orig; }, 1800);
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadOrders();
</script>
</body>
</html>
